<svg width="600" height="110" viewBox="0 0 600 110" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Liquid Aura -->
    <radialGradient id="pillAura" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#0284c7" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Liquid Button Gradient -->
    <linearGradient id="btnGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>

    <!-- Outer Capsule Glass -->
    <linearGradient id="glassBorder" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="glassFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.25"/>
    </linearGradient>

    <!-- Inner Track Glass -->
    <linearGradient id="trackBorder" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="trackFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.45"/>
    </linearGradient>

    <!-- Shadow filter for authentic liquid depth -->
    <filter id="shadow" x="0" y="0" width="600" height="110" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0ea5e9" flood-opacity="0.16"/>
    </filter>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
  </style>

  <!-- Ambient Fluid Glow Behind Pill -->
  <rect x="15" y="10" width="570" height="85" rx="42" fill="url(#pillAura)"/>

  <!-- Outer Glass Capsule -->
  <g filter="url(#shadow)">
    <rect x="20" y="19" width="560" height="72" rx="26" fill="url(#glassFill)" stroke="url(#glassBorder)" stroke-width="1.2"/>
  </g>

  <!-- Inner Translucent Glass Track -->
  <rect x="26" y="25" width="488" height="60" rx="20" fill="url(#trackFill)" stroke="url(#trackBorder)" stroke-width="1"/>
  
  <text class="font-sans" x="50" y="61" fill="#71717a" font-size="17" font-weight="500">medium.com/@</text>
  <text class="font-sans" x="175" y="61" fill="#a1a1aa" font-size="17" font-weight="400">username</text>

  <!-- Glossy Action Button -->
  <rect x="526" y="32" width="46" height="46" rx="18" fill="url(#btnGrad)" stroke="#ffffff" stroke-width="0.8" stroke-opacity="0.5"/>
  <path d="M549 61 V47 M542 54 L549 47 L556 54" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
