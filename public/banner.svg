<svg width="580" height="92" viewBox="0 0 580 92" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Liquid Glass Capsule Filter (Subtle ambient glass shadow) -->
    <filter id="liquidGlassShadow" x="0" y="0" width="580" height="92" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0284c7" flood-opacity="0.14"/>
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#000000" flood-opacity="0.04"/>
    </filter>

    <!-- Outer Capsule Glass Gradients -->
    <linearGradient id="outerGlassFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.45"/>
    </linearGradient>

    <linearGradient id="outerGlassBorder" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.5"/>
    </linearGradient>

    <!-- Inner Track Glass Gradients -->
    <linearGradient id="innerTrackFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.75"/>
    </linearGradient>

    <linearGradient id="innerTrackBorder" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.7"/>
    </linearGradient>

    <!-- Liquid Blue Button Gradient -->
    <linearGradient id="liquidBtnGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>

    <filter id="btnGloss" x="510" y="10" width="60" height="60" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0284c7" flood-opacity="0.35"/>
    </filter>
  </defs>

  <style>
    .glass-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
  </style>

  <!-- 1. Outer Liquid Glass Capsule -->
  <g filter="url(#liquidGlassShadow)">
    <rect x="10" y="8" width="560" height="72" rx="26" fill="url(#outerGlassFill)" stroke="url(#outerGlassBorder)" stroke-width="1.2"/>
    <!-- Specular highlight on top edge -->
    <path d="M36 9.2 H544" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" stroke-opacity="0.95"/>
  </g>

  <!-- 2. Inner Translucent Track -->
  <rect x="16" y="14" width="494" height="60" rx="20" fill="url(#innerTrackFill)" stroke="url(#innerTrackBorder)" stroke-width="1"/>
  <!-- Specular rim inside track -->
  <path d="M36 15.2 H490" stroke="#ffffff" stroke-width="1" stroke-linecap="round" stroke-opacity="0.9"/>

  <!-- Text -->
  <text class="glass-text" x="40" y="50" fill="#9ca3af" font-size="17" font-weight="500">medium.com/@</text>
  <text class="glass-text" x="165" y="50" fill="#cbd5e1" font-size="17" font-weight="400">username</text>

  <!-- 3. Glossy Liquid Blue Action Button -->
  <g filter="url(#btnGloss)">
    <rect x="518" y="21" width="46" height="46" rx="18" fill="url(#liquidBtnGrad)" stroke="#ffffff" stroke-width="1" stroke-opacity="0.65"/>
  </g>
  <!-- Up Arrow -->
  <path d="M541 50 V36 M534 43 L541 36 L548 43" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
